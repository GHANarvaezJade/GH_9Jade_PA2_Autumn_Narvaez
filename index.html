<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Tables & Images with Bootstrap</title>

<body>
    <h2 class="text-center">Naruto Characters - Team 7</h2>
    <div class="row">
    <img class="rounded mx-auto d-block col-lg-4" src="https://a1cf74336522e87f135f-2f21ace9a6cf0052456644b80fa06d4f.ssl.cf2.rackcdn.com/images/characters/large/2800/Sasuke-Uchiha.Naruto.webp" alt="Uchiha Sasuke" height="200px" weight="250px">
    <img class="rounded-circle mx-auto d-block col-lg-4" src="https://static0.cbrimages.com/wordpress/wp-content/uploads/2022/10/Sakura-Haruno.jpg?q=50&fit=crop&w=1232&h=693&dpr=1.5" alt="Haruno Sakura" height="200px" weight="250px">
    <img class="thumbnail mx-auto d-block col-lg-4" src="https://static0.srcdn.com/wordpress/wp-content/uploads/2024/05/10-ways-naruto-changed-anime-forever.jpg?q=49&fit=crop&w=642&h=393&dpr=2" alt="Uzumaki Naruto" height="200px" weight="250px">
    </div>

<br>

        <tr>
            <th class="bg-primary" scope="col">Name</th>

        <tr>
            <td>Autumn Narvaez</td>

            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxTVM8XKWFLbeg7xvA0DI5cxnty6MaQrWElnquiidgEmDk1tYDM2Q6D6Kg3kLY_x7DKf3ZTXlFpMYWu51CBIYcumdCpuvPrL4RTQ0-gBI&s=10" height="50px" weight="100"></td>
        </tr>
        <tr>
            <td>Theos Tomas</td>
            <td>Bleach</td>
            <td><img src="https://upload.wikimedia.org/wikipedia/en/1/1e/IchigoKurosakiBleach.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" height="50px" weight="100"></td>
        </tr>
        <tr>
            <td>Dyce Aquino</td>
            <td>One Piece</td>

        </tr>
        <tr>
            <td>Kelly Rejesus</td>
            <td>Haikyu!!</td>
